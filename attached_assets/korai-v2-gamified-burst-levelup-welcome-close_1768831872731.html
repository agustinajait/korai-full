<script>
/* ===================== Gamification SFX (Web Audio API) ===================== */
const SFX = (() => {
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  let ctx = null;

  function ensure(){
    if(!AudioCtx) return null;
    if(!ctx) ctx = new AudioCtx();
    // Resume on first gesture if suspended
    if (ctx.state === 'suspended') ctx.resume().catch(()=>{});
    return ctx;
  }

  function tone({freq=440, dur=0.10, type='sine', gain=0.06, pan=0}={}){
    const c = ensure(); if(!c) return;
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = type; o.frequency.value = freq;

    // Optional panner
    let node = o;
    if (c.createStereoPanner){
      const p = c.createStereoPanner();
      p.pan.value = pan;
      node.connect(p); p.connect(g);
    } else {
      node.connect(g);
    }
    g.connect(c.destination);

    const t = c.currentTime;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, gain), t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

    o.start(t);
    o.stop(t + dur + 0.02);
  }

  function tick(){ tone({freq:900, dur:0.06, type:'triangle', gain:0.035}); }
  function screen(){ tone({freq:520, dur:0.08, type:'sine', gain:0.03, pan:-0.15}); }
  function choice(color){
    if(color==='verde') tone({freq:760, dur:0.10, type:'sine', gain:0.06});
    if(color==='amarillo') tone({freq:560, dur:0.10, type:'sine', gain:0.06});
    if(color==='rojo') tone({freq:360, dur:0.12, type:'sine', gain:0.065});
  }
  function achievement(){
    // simple arpeggio
    const seq = [740, 880, 1040, 1320];
    seq.forEach((f,i)=> setTimeout(()=> tone({freq:f, dur:0.10, type:'sine', gain:0.06, pan: (i%2?0.12:-0.12)}), i*90));
  }

  return { ensure, tone, tick, screen, choice, achievement };
})();

/* ===================== Haptics ===================== */
function haptic(color){
  if(!navigator.vibrate) return;
  if(color==='verde') navigator.vibrate(10);
  else if(color==='amarillo') navigator.vibrate([12, 18, 12]);
  else navigator.vibrate([20, 24, 20]);
}

/* ===================== Confetti ===================== */
const Confetti = (() => {
  const canvas = () => document.getElementById('confetti');
  let parts = [];
  let raf = null;

  function resize(){
    const c = canvas(); if(!c) return;
    c.width = window.innerWidth;
    c.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);

  function burst(){
    const c = canvas(); if(!c) return;
    resize();
    const W = c.width, H = c.height;
    parts = [];
    const n = Math.min(240, Math.max(120, Math.floor(W/6)));
    for(let i=0;i<n;i++){
      parts.push({
        x: W*0.5, y: H*0.18,
        vx: (Math.random()*2-1) * (4 + Math.random()*6),
        vy: (Math.random()*-1) * (6 + Math.random()*8),
        g: 0.22 + Math.random()*0.16,
        r: 3 + Math.random()*3,
        a: 1,
        hue: Math.floor(Math.random()*360),
        rot: Math.random()*Math.PI*2,
        vr: (Math.random()*2-1)*0.25
      });
    }
    if(raf) cancelAnimationFrame(raf);
    raf = requestAnimationFrame(tick);
  }

  function tick(){
    const c = canvas(); if(!c) return;
    const ctx = c.getContext('2d');
    ctx.clearRect(0,0,c.width,c.height);
    for(const p of parts){
      p.vy += p.g;
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vr;
      p.a *= 0.992;

      ctx.save();
      ctx.translate(p.x,p.y);
      ctx.rotate(p.rot);
      ctx.globalAlpha = Math.max(0,p.a);
      ctx.fillStyle = `hsl(${p.hue} 90% 60%)`;
      ctx.fillRect(-p.r, -p.r, p.r*2.2, p.r*1.4);
      ctx.restore();
    }
    parts = parts.filter(p => p.y < c.height + 40 && p.a > 0.05);
    if(parts.length){
      raf = requestAnimationFrame(tick);
    } else {
      const ctx = c.getContext('2d');
      ctx.clearRect(0,0,c.width,c.height);
    }
  }

  return { burst };
})();

/* ===================== UI helpers ===================== */
function pulseTarget(){
  try{
    const el = (typeof event !== 'undefined' && event.currentTarget) ? event.currentTarget : null;
    if(!el) return;
    el.classList.remove('pulse');
    void el.offsetWidth; // reflow
    el.classList.add('pulse');
    setTimeout(()=>el.classList.remove('pulse'), 260);
  }catch(e){}
}

function celebrateProgress(){
  const bar = document.querySelector('.bar');
  if(bar){
    bar.classList.remove('bar-celebrate');
    void bar.offsetWidth;
    bar.classList.add('bar-celebrate');
    setTimeout(()=>bar.classList.remove('bar-celebrate'), 520);
  }
}

function scrollToQuestion(){
  try{
    const el = document.getElementById('questionCard');
    if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
    else window.scrollTo({top:0, behavior:'smooth'});
  }catch(e){}
}

// --- UX: beep + optional haptic (only works after user interaction) ---
function scrollToQuestion(){

    const el = document.getElementById('questionCard');
    if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
    else window.scrollTo({top:0, behavior:'smooth'});
  }catch(e){}
}

function playChoiceSound(color){
  try{
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if(!AudioCtx) return;
    const ctx = playChoiceSound._ctx || (playChoiceSound._ctx = new AudioCtx());
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    const freq = color==='verde' ? 740 : (color==='amarillo' ? 520 : 320);
    o.type = 'sine';
    o.frequency.value = freq;
    g.gain.value = 0.0001;
    o.connect(g); g.connect(ctx.destination);
    const t = ctx.currentTime;
    g.gain.exponentialRampToValueAtTime(0.08, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
    o.start(t); o.stop(t + 0.15);
    if (navigator.vibrate) navigator.vibrate(10);
  }catch(e){}
}



/* ===================== Mini Burst per selection ===================== */
function burstAt(x,y,color){
  const c = document.getElementById('confetti');
  if(!c) return;
  const ctx = c.getContext('2d');
  c.width = window.innerWidth; c.height = window.innerHeight;
  const parts = [];
  const hues = color==='verde'? [120,135]: color==='amarillo'?[45,55]:[0,10];
  for(let i=0;i<24;i++){
    parts.push({
      x,y,
      vx:(Math.random()*2-1)*3,
      vy:(Math.random()*-1)*4,
      g:0.25,
      a:1,
      r:2+Math.random()*2,
      h:hues[0]+Math.random()*(hues[1]-hues[0])
    });
  }
  let t=0;
  (function draw(){
    ctx.clearRect(0,0,c.width,c.height);
    parts.forEach(p=>{
      p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.a*=0.92;
      ctx.fillStyle=`hsla(${p.h},90%,60%,${p.a})`;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
    });
    if(t++<20) requestAnimationFrame(draw);
  })();
}

function checkLevelUp(){

  const indicators = instrument.indicators;
  for(const d of dims){
    const ids = indicators.filter(i=>i.dimension===d.id).map(i=>i.id);

      state._leveled[d.id]=true;
      try{ SFX.achievement(); }catch(e){}
      showLevelToast(d);

  }

  function avgToColor(avg) {
    if (avg === null) return 'gris';
    if (avg < 0.8) return 'rojo';

  function computeResult(instrument, answers) {
    const dims = instrument.dimensions.map(d => d.id);

    const perDim = Object.fromEntries(dims.map(d => [d, {
      n:0, r:0, a:0, v:0, pctR:0, pctA:0, pctV:0, color:'gris'
    }]));

    let totalN=0, totalR=0, totalA=0, totalV=0;
    let totalScore=0, totalScoreMax=0; // opcional para futuras lecturas numéricas

    for (const ind of instrument.indicators) {
      const opt = optionById(answers[ind.id]);
      if (!opt) continue;

      // score numérico (mantener por compatibilidad / futura analítica)
      const raw = opt.score; // rojo=0, amarillo=1, verde=2
      const s = ind.invert ? (2 - raw) : raw;
      totalScore += s; totalScoreMax += 2;

      // color (para regla 33%)
      const key = (raw === 0) ? 'rojo' : (raw === 1) ? 'amarillo' : 'verde';
      const d = perDim[ind.dimension];
      d.n += 1;
      if (key === 'rojo') d.r += 1;
      else if (key === 'amarillo') d.a += 1;
      else d.v += 1;

      totalN += 1;
      if (key === 'rojo') totalR += 1;
      else if (key === 'amarillo') totalA += 1;
      else totalV += 1;
    }

    function color33(rCount, aCount, nCount) {
      if (!nCount) return 'gris';
      const pR = rCount / nCount;
      const pA = aCount / nCount;
      if (pR >= 0.33) return 'rojo';
      if (pA >= 0.33) return 'amarillo';
      return 'verde';
    }

    for (const d of dims) {
      const x = perDim[d];
      if (x.n) {
        x.pctR = x.r / x.n;
        x.pctA = x.a / x.n;
        x.pctV = x.v / x.n;
      }
      x.color = color33(x.r, x.a, x.n);
    }

    const overall = {
      n: totalN,
      r: totalR,
      a: totalA,
      v: totalV,
      pctR: totalN ? totalR/totalN : 0,
      pctA: totalN ? totalA/totalN : 0,
      pctV: totalN ? totalV/totalN : 0,
      color: color33(totalR, totalA, totalN),
      // indicador numérico opcional: severidad 0..200
      severity: Math.round((2*(totalN?totalR/totalN:0) + 1*(totalN?totalA/totalN:0))*100),
      score_total: totalScore,
      score_max: totalScoreMax
    };

    return { perDim, overall };
  }

  function topKeywords(text, k=10) {
    const stop = new Set(['de','la','el','y','en','a','que','los','las','un','una','por','para','con','mi','mis','me','yo','no','si','sí','muy','ya','al','del','se','es','hay','porque','pero','como','más','menos','este','esta','esto','tengo','tenemos','estoy','estamos','son','ser','sobre','lo','le','les','su','sus']);
    const words = (text || '').toLowerCase().replace(/[^a-záéíóúñü0-9\s]/g,' ').split(/\s+/).filter(w => w.length >= 4 && !stop.has(w));
    const freq = new Map();
    for (const w of words) freq.set(w, (freq.get(w)||0)+1);
    return [...freq.entries()].sort((a,b)=>b[1]-a[1]).slice(0,k).map(([w,c])=>({w,c}));
  }

  function aggregate(records, instrument, filters) {
    const now = Date.now();
    const from = now - (filters.days * 24*60*60*1000);

    const filtered = records.filter(r => {
      const t = new Date(r.timestamp).getTime();
      if (!isFinite(t) || t < from) return false;
      if (filters.ciudad && (r.territorio?.ciudad || '') !== filters.ciudad) return false;
      if (filters.barrio && (r.territorio?.barrio || '') !== filters.barrio) return false;
      return true;
    });

    let rojo=0, amarillo=0, verde=0;
    const byDim = {};
    instrument.dimensions.forEach(d => byDim[d.id] = {rojo:0, amarillo:0, verde:0, n:0});
    const frases = [];

    for (const r of filtered) {
      const overall = r.semaforo_overall?.color;
      if (overall === 'rojo') rojo++; else if (overall === 'amarillo') amarillo++; else if (overall === 'verde') verde++;
      for (const d of instrument.dimensions) {
        const c = r.semaforo?.[d.id];
        if (!c) continue;
        byDim[d.id][c] += 1; byDim[d.id].n += 1;
      }
      if (r.texto_abierto && String(r.texto_abierto).trim().length) {
        frases.push({ t: r.timestamp, ciudad: r.territorio?.ciudad || '', barrio: r.territorio?.barrio || '', overall: overall || 'gris', text: String(r.texto_abierto).trim() });
      }
    }

    const n = filtered.length;
    const dist = n ? { rojo: rojo/n, amarillo: amarillo/n, verde: verde/n } : {rojo:0, amarillo:0, verde:0};
    const temas = topKeywords(frases.map(f => f.text).join(' '), 10);
    frases.sort((a,b) => new Date(b.t) - new Date(a.t));
    return {n, dist, byDim, frases, temas};
  }

  function startSurvey() { state.answers = {}; state.texto_abierto=''; state.lastResult=null; go('survey'); }

  
function renderSurvey() {
    const instrument = getInstrument();
    const indicators = instrument.indicators;
    const dimsById = Object.fromEntries(instrument.dimensions.map(d => [d.id, d]));
    const answered = Object.keys(state.answers).length;
    const total = indicators.length;
    const pct = Math.round((answered/total)*100);

    if (!state.survey) state.survey = { mode:'guided', idx:0, showAll:false };
    if (state.survey.idx < 0) state.survey.idx = 0;
    if (state.survey.idx >= total) state.survey.idx = total - 1;

    // pick current indicator; if already answered, advance to next unanswered
    const nextUnanswered = (fromIdx, dir=1) => {
      let i = fromIdx;
      for (let steps=0; steps<total; steps++) {
        const ind = indicators[i];
        if (!state.answers[ind.id]) return i;
        i = (i + dir + total) % total;
      }
      return fromIdx;
    };
    state.survey.idx = nextUnanswered(state.survey.idx, 1);

    const cur = indicators[state.survey.idx];
    const dim = dimsById[cur.dimension] || { name: cur.dimension, emoji:'' };
    const currentValue = state.answers[cur.id] || null;

    const dimCounts = instrument.dimensions.map(d => {
      const ids = indicators.filter(i => i.dimension === d.id).map(i => i.id);
      const a = ids.filter(id => state.answers[id]).length;
      return { id:d.id, name:d.name, emoji:d.emoji, a, t: ids.length };
    });

    const canFinish = answered === total;

    const choiceBtn = (color, label, desc) => {
      const isSel = currentValue === color;
      const cls = color === 'verde' ? 'choice choice-green' : color === 'amarillo' ? 'choice choice-yellow' : 'choice choice-red';
      return `
        <button class="${cls} ${isSel?'choice-selected':''}" onclick="setAnswerAndAdvance('${cur.id}','${color}')">
          <div class="flex items-center justify-between gap-4">
            <div>
              <div class="font-black text-lg">${label}</div>
              <div class="text-sm opacity-90">${desc}</div>
            </div>
            <div class="choice-dot"></div>
          </div>
        </button>
      `;
    };

    return layout(`
      <div class="grid lg:grid-cols-12 gap-6 fade-in">
        <!-- Lateral: progreso -->
        <div class="lg:col-span-4 progressSide">
          <div class="card p-6 sticky top-6">

              <div class="bar mt-2"><div style="width:${pct}%;background:linear-gradient(90deg,#22c55e,#f59e0b,#ef4444)"></div></div>
            </div>

            <div class="mt-5 space-y-2">
              ${dimCounts.map(dc => {
                const dimPct = Math.round((dc.a/dc.t)*100);
                return `
                  <button class="w-full text-left px-4 py-3 rounded-2xl border border-slate-100 hover:bg-slate-50"
                    onclick="jumpToDimension('${dc.id}')">

                      <div class="font-bold">${dc.emoji} ${escapeHtml(dc.name)}</div>
                      <div class="text-xs text-slate-500">${dc.a}/${dc.t}</div>
                    </div>
                    <div class="bar mt-2"><div style="width:${dimPct}%;background:#2563eb"></div></div>
                  </button>
                `;
              }).join('')}
            </div>

            <div class="mt-5 p-4 rounded-2xl border border-slate-100">
              <div class="font-black mb-1">Tu voz (opcional)</div>
              <div class="text-xs text-slate-500 mb-2">No incluyas datos personales.</div>
              <textarea class="k-input" style="min-height:90px" placeholder="En pocas palabras, ¿cómo estás viviendo hoy?"
                oninput="state.texto_abierto=this.value">${escapeHtml(state.texto_abierto||'')}</textarea>
            </div>

            <div class="mt-5 flex flex-wrap gap-3">
              <button class="btn btn-ghost" onclick="go('dashboard')">Ver dashboard</button>
              <button class="btn btn-primary" onclick="finishSurvey()" ${canFinish?'':'style="opacity:.5;cursor:not-allowed" disabled'}>
                Finalizar y ver mi semáforo
              </button>
            </div>
          </div>
        </div>

        <!-- Centro: pregunta -->
        <div class="lg:col-span-8">
          <div class="card p-8">
            <div class="flex items-start justify-between gap-4">
              <div>
                <div class="text-sm text-slate-500 font-bold">Paso ${state.survey.idx+1} de ${total}</div>

  function jumpToDimension(dimId) {
    const instrument = getInstrument();
    const indicators = instrument.indicators;
    const idx = indicators.findIndex(i => i.dimension === dimId);
    if (idx >= 0) { state.survey.idx = idx; render(); scrollToQuestion(); }
  }

    function setAnswerAndAdvance(indId, color) {
  const rect = event?.currentTarget?.getBoundingClientRect?.();
  if(rect) burstAt(rect.left+rect.width/2, rect.top+rect.height/2, color);

    try{ SFX.choice(color); SFX.tick(); haptic(color); pulseTarget(); celebrateProgress(); }catch(e){}

    const instrument = getInstrument();
    state.answers[indId] = color;
  checkLevelUp();

    const total = instrument.indicators.length;
    const answered = Object.keys(state.answers).length;

    // If completed, auto-finish (prevents infinite loop)
    if (answered >= total) {
      finishSurvey();
      return;
    }

    // Otherwise, jump to the next unanswered indicator
    nextQuestion();
  }


    function nextQuestion() {
    try{ SFX.tick(); }catch(e){}
    const instrument = getInstrument();
    const indicators = instrument.indicators;
    const total = indicators.length;

    if (!state.survey) state.survey = { idx:0 };

    // If all answered, auto-finish
    if (Object.keys(state.answers).length >= total) {
      finishSurvey();
      return;
    }

    // Find next unanswered, scanning forward (no infinite cycling)
    for (let steps = 1; steps <= total; steps++) {
      const idx = state.survey.idx + steps;
      if (idx >= total) break; // stop at end
      const ind = indicators[idx];
      if (!state.answers[ind.id]) {
        state.survey.idx = idx;
        render(); scrollToQuestion();
        return;
      }
    }

    // If none ahead, scan from start up to current
    for (let idx = 0; idx <= state.survey.idx; idx++) {
      const ind = indicators[idx];
      if (!state.answers[ind.id]) {
        state.survey.idx = idx;
        render(); scrollToQuestion();
        return;
      }
    }

    // Fallback
    finishSurvey();
  }


    function prevQuestion() {
    const instrument = getInstrument();
    const indicators = instrument.indicators;
    const total = indicators.length;
    if (!state.survey) state.survey = { idx:0 };

    let idx = state.survey.idx - 1;
    if (idx < 0) idx = 0;
    state.survey.idx = idx;
    render(); scrollToQuestion();
  }



  function finishSurvey() {
    const instrument = getInstrument();
    const total = instrument.indicators.length;
    const answered = Object.keys(state.answers).length;
    if (answered < total) {
      alert(`Faltan ${total-answered} preguntas por responder para finalizar.`);
      return;
    }
    
    try{ SFX.achievement(); Confetti.burst(); }catch(e){}
    const result = computeResult(instrument, state.answers);
    state.lastResult = result;
    const sem = {}; instrument.dimensions.forEach(d => sem[d.id] = result.perDim[d.id].color);

    const rec = {
      timestamp: new Date().toISOString(),
      territorio: { ciudad: state.contexto.ciudad || '', barrio: state.contexto.barrio || '' },
      perfil_contextual: {
        edad_rango: state.contexto.edad_rango || '',

        hijos_a_cargo: state.contexto.hijos_a_cargo,
        adultos_mayores_a_cargo: state.contexto.adultos_mayores_a_cargo

      answers: state.answers,
      semaforo: sem,
      semaforo_overall: result.overall,
      texto_abierto: (state.texto_abierto||'').trim()
    };
    const records = loadRecords(); records.push(rec); saveRecords(records);
    go('result');
  }

  function computeKPI(cur, prev) {
    const dimWorst = cur.dimWorst;
    const deltaSev = (cur.globalSeverity !== null && prev.globalSeverity !== null) ? (cur.globalSeverity - prev.globalSeverity) : null;

    const cards = [
      { label:'N diagnósticos', value:String(cur.n), sub: (prev.n ? `vs prev: ${prev.n}` : '—') },
      { label:'% Rojo global', value: fmtPct(cur.distGlobal.rojo), sub: (prev.n ? `vs prev: ${fmtPct(prev.distGlobal.rojo)}` : '—') },
      { label:'Dimensión más crítica', value: dimWorst ? dimWorst.name : '—', sub: dimWorst ? `Sev ${dimWorst.severity} · R ${fmtPct(dimWorst.pct.rojo)} <span class="text-slate-400">·</span> <button class="link" onclick="state.dashboard.dimFocus='${dimWorst.id}'; render();">Ver por qué</button>` : '—' },
      { label:'Tendencia', value: (deltaSev===null ? '—' : (deltaSev>0 ? `↑ +${deltaSev}` : deltaSev<0 ? `↓ ${deltaSev}` : '0')), sub: 'Δ severidad global' }
    ];
    return { cards };
  }

  function computeTerritoryView(recordsAll, instrument, filters, offsetDays) {
    const now = Date.now();
    const to = now - (offsetDays * 24*60*60*1000);
    const from = to - (filters.days * 24*60*60*1000);

    const records = recordsAll.filter(r => {
      const t = new Date(r.timestamp).getTime();
      if (!isFinite(t) || t < from || t >= to) return false;
      if (filters.ciudad && (r.territorio?.ciudad || '') !== filters.ciudad) return false;
      if (filters.barrio && (r.territorio?.barrio || '') !== filters.barrio) return false;
      return true;
    });

    // Global dist based on overall.color (computed via rule 33%)
    let rojo=0, amarillo=0, verde=0;
    for (const r of records) {
      const c = r.semaforo_overall?.color;
      if (c === 'rojo') rojo++;
      else if (c === 'amarillo') amarillo++;
      else if (c === 'verde') verde++;
    }
    const n = records.length;
    const distGlobal = n ? { rojo: rojo/n, amarillo: amarillo/n, verde: verde/n } : {rojo:0, amarillo:0, verde:0};
    const globalSeverity = n ? Math.round((2*distGlobal.rojo + 1*distGlobal.amarillo)*100) : null;

    const byDim = {};
    instrument.dimensions.forEach(d => {
      byDim[d.id] = computeDimMetrics(records, instrument, d.id);
    });

    // Worst dimension by severity (with N threshold)
    const dimWorst = instrument.dimensions
      .map(d => ({ id:d.id, name:d.name, emoji:d.emoji, ...byDim[d.id] }))
      .filter(x => x.nValid >= 30)
      .sort((a,b) => (b.severity - a.severity))[0] || null;

    // frases + temas (global)
    const frases = records
      .filter(r => r.texto_abierto && String(r.texto_abierto).trim().length)
      .map(r => ({ t: r.timestamp, ciudad: r.territorio?.ciudad || '', barrio: r.territorio?.barrio || '', text: String(r.texto_abierto).trim() }))
      .sort((a,b) => new Date(b.t) - new Date(a.t));

    const temas = topKeywords(frases.map(f => f.text).join(' '), 10);

    return { n, distGlobal, globalSeverity, byDim, dimWorst, frases, temas, records };
  }

  function computeDimMetrics(records, instrument, dimId) {
    let cR=0, cA=0, cV=0, nValid=0;
    for (const r of records) {
      const c = r.semaforo?.[dimId];
      if (!c) continue;
      nValid++;
      if (c === 'rojo') cR++;
      else if (c === 'amarillo') cA++;
      else if (c === 'verde') cV++;
    }
    const pct = nValid ? { rojo: cR/nValid, amarillo: cA/nValid, verde: cV/nValid } : {rojo:0, amarillo:0, verde:0};
    const color = nValid < 30 ? 'gris' : territoryDimColor(pct);
    const severity = nValid ? Math.round((2*pct.rojo + 1*pct.amarillo)*100) : 0;

    // Drivers sobre subset rojo en dimensión
    const subset = records.filter(r => r.semaforo?.[dimId] === 'rojo');
    const indicators = instrument.indicators.filter(ind => ind.dimension === dimId);

    const driverStats = indicators.map(ind => {
      let n=0, r=0, a=0, v=0;
      for (const rec of subset) {
        const ans = rec.answers?.[ind.id];
        if (!ans) continue;
        n++;
        if (ans === 'rojo') r++;
        else if (ans === 'amarillo') a++;
        else if (ans === 'verde') v++;
      }
      return { id: ind.id, label: ind.label, n, pctR: n? r/n : 0, pctA: n? a/n : 0, pctV: n? v/n : 0 };
    }).sort((x,y) => y.pctR - x.pctR);

    return { nValid, pct, color, severity, drivers: driverStats };
  }

  function territoryDimColor(pct) {
    // pct in {rojo,amarillo,verde}
    if (pct.rojo >= pct.amarillo && pct.rojo >= pct.verde) return 'rojo';
    if (pct.amarillo >= pct.verde) return 'amarillo';
    return 'verde';
  }

  function buildDimensionDrilldown(cur, instrument, dimId) {
    const dim = instrument.dimensions.find(d => d.id === dimId);
    const row = cur.byDim[dimId];

    // indicadores (ordenados) + top marker
    const topIds = new Set(row.drivers.slice(0,3).map(x => x.id));
    const indicators = row.drivers.map(x => ({ ...x, isTop: topIds.has(x.id) }));

    // frases asociadas: subgrupo rojo en dim
    const subset = cur.records.filter(r => r.semaforo?.[dimId] === 'rojo' && r.texto_abierto && String(r.texto_abierto).trim().length)
      .map(r => ({ t:r.timestamp, ciudad:r.territorio?.ciudad||'', barrio:r.territorio?.barrio||'', text:String(r.texto_abierto).trim() }))
      .sort((a,b) => new Date(b.t) - new Date(a.t));

    const temas = topKeywords(subset.map(f => f.text).join(' '), 10);

    return { dim, row, indicators, frases: subset, temas };
  }

  

  function renderDistLine(label, pct, color) {
    const w = Math.round(pct*100);
    return `
      <div>
        <div class="flex items-center justify-between text-sm">
          <div class="font-bold">${label}</div>
          <div class="text-slate-600">${w}%</div>
        </div>
        <div class="bar mt-1"><div style="width:${w}%;background:${color}"></div></div>
      </div>
    `;
  }

  function exportJSON() {
    downloadFile('korai_records.json', JSON.stringify(loadRecords(), null, 2), 'application/json');
  }
  function importJSON(evt) {
    const file = evt.target.files?.[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(String(reader.result||''));
        if (!Array.isArray(parsed)) throw new Error('Formato inválido (se esperaba array).');
        const merged = loadRecords().concat(parsed);
        saveRecords(merged);
        render();
        alert('Importación OK. Registros totales: ' + merged.length);
      } catch (e) { alert('Error importando JSON: ' + e.message); }
    };
    reader.readAsText(file);
  }

  function exportInstrument() {
    downloadFile('korai_instrument.json', JSON.stringify(getInstrument(), null, 2), 'application/json');
  }
  function importInstrument(evt) {
    const file = evt.target.files?.[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(String(reader.result||''));
        if (!parsed || !Array.isArray(parsed.dimensions) || !Array.isArray(parsed.indicators)) throw new Error('Instrumento inválido.');
        localStorage.setItem(STORAGE_CFG_KEY, JSON.stringify(parsed));
        render();
        alert('Instrumento importado. Indicadores: ' + parsed.indicators.length);
      } catch (e) { alert('Error importando instrumento: ' + e.message); }
    };
    reader.readAsText(file);
  }
  function clearInstrumentOverride() { localStorage.removeItem(STORAGE_CFG_KEY); render(); }

  function downloadFile(filename, content, mime) {
    const blob = new Blob([content], {type:mime});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }

  function uniqueCities(records) {
    const set = new Set(['Berazategui']);
    for (const r of records) { const c = r.territorio?.ciudad; if (c) set.add(c); }
    return [...set];
  }
  function escapeHtml(s) {
    return String(s ?? '').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');
  }
  function resetAll() { if (!confirm('Esto borrará los registros locales. ¿Continuar?')) return; localStorage.removeItem(STORAGE_KEY); render(); }

  function render() {
    const app = document.getElementById('app'); if (!app) return;
    switch(state.screen) {
      case 'home': app.innerHTML = renderHome(); break;
      case 'survey': app.innerHTML = renderSurvey(); forceScrollToQuestion(); break;
      case 'result': app.innerHTML = renderResult(); break;
      case 'dashboard': app.innerHTML = renderDashboard(); break;
      default: app.innerHTML = renderHome();
    }
  }

  render();
  </script>
